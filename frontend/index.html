<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GLOWWITHRUMI — Korean & International Skincare in Ghana</title>
    <link rel="canonical" href="https://glowwithrumi.com/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#D3839E" />

    <!-- How the link looks when shared on WhatsApp, Instagram, Facebook, X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GLOWWITHRUMI" />
    <meta property="og:url" content="https://glowwithrumi.com/" />
    <meta property="og:image" content="https://glowwithrumi.com/favicon.png" />
    <meta property="og:locale" content="en_GH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GLOWWITHRUMI — Korean & International Skincare in Ghana" />
    <meta
      name="twitter:description"
      content="Authentic Korean and international skincare and beauty, delivered across Ghana."
    />
    <meta name="twitter:image" content="https://glowwithrumi.com/favicon.png" />

    <!-- Tells Google this is a shop, with its name, logo and how to reach it,
         so the search result can show more than a plain blue link. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "GLOWWITHRUMI",
        "description": "Authentic Korean and international skincare and beauty, delivered across Ghana.",
        "url": "https://glowwithrumi.com/",
        "logo": "https://glowwithrumi.com/favicon.png",
        "image": "https://glowwithrumi.com/favicon.png",
        "telephone": "+233594469052",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Grace Nkansah Apartment, Dome",
          "addressLocality": "Accra",
          "addressCountry": "GH"
        },
        "areaServed": "GH",
        "priceRange": "GH₵"
      }
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <!--
      The catalogue is fetched before the first render, so #root is empty for a
      moment. This placeholder fills that gap and is replaced the instant React
      mounts; without it the shop opens on a blank white page.
    -->
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 26px;
          background: #ffffff;
          font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        "
      >
        <img
          src="/logo.png"
          alt="GLOWWITHRUMI"
          width="150"
          style="width: 150px; height: auto; animation: gwr-breathe 1.6s ease-in-out infinite;"
        />
        <div
          style="
            width: 120px;
            height: 3px;
            border-radius: 999px;
            overflow: hidden;
            background: #ede4d6;
          "
        >
          <div
            style="
              width: 40%;
              height: 100%;
              border-radius: 999px;
              background: #d3839e;
              animation: gwr-slide 1.1s ease-in-out infinite;
            "
          ></div>
        </div>
        <style>
          @keyframes gwr-breathe {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.97); }
          }
          @keyframes gwr-slide {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
