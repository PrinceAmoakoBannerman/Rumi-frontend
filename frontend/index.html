<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GLOWWITHRUMI — Korean & International Skincare in Ghana</title>
    <link rel="canonical" href="https://glowwithrumi.com/" />
    <meta name="theme-color" content="#D3839E" />

    <!-- How the link looks when shared on WhatsApp, Instagram, Facebook, X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GLOWWITHRUMI" />
    <meta property="og:url" content="https://glowwithrumi.com/" />
    <meta property="og:image" content="https://glowwithrumi.com/favicon.png" />
    <meta property="og:locale" content="en_GH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GLOWWITHRUMI — Korean & International Skincare in Ghana" />
    <meta
      name="twitter:description"
      content="Authentic Korean and international skincare and beauty, delivered across Ghana."
    />
    <meta name="twitter:image" content="https://glowwithrumi.com/favicon.png" />

    <!-- Tells Google this is a shop, with its name, logo and how to reach it,
         so the search result can show more than a plain blue link. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "GLOWWITHRUMI",
        "description": "Authentic Korean and international skincare and beauty, delivered across Ghana.",
        "url": "https://glowwithrumi.com/",
        "logo": "https://glowwithrumi.com/favicon.png",
        "image": "https://glowwithrumi.com/favicon.png",
        "telephone": "+233594469052",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Grace Nkansah Apartment, Dome",
          "addressLocality": "Accra",
          "addressCountry": "GH"
        },
        "areaServed": "GH",
        "priceRange": "GH₵"
      }
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <!--
      The catalogue is fetched before the first render, so #root is empty for a
      moment. This placeholder fills that gap and is replaced the instant React
      mounts; without it the shop opens on a blank white page.
    -->
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #faf7f2;
          font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        "
      >
        <div
          style="
            width: 34px;
            height: 34px;
            border: 3px solid #ede4d6;
            border-top-color: #d3839e;
            border-radius: 50%;
            animation: gwr-spin 0.8s linear infinite;
          "
        ></div>
        <p
          style="
            margin: 0;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #d3839e;
            font-weight: 600;
          "
        >
          Glowwithrumi
        </p>
        <style>
          @keyframes gwr-spin {
            to {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
